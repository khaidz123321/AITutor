<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Khám phá tất cả khóa học tại PTIT E-Learning.">
    <title>Danh sách khóa học - PTIT E-Learning</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/courses.css">
</head>
<body>
    <script src="components/header.js"></script>

    <div class="container">
        <div class="courses-page-layout">
            <!-- Filter Sidebar -->
            <aside class="filter-sidebar">
                <div class="filter-title">Bộ lọc</div>

                <div class="filter-group">
                    <div class="filter-group-title">Danh mục</div>
                    <button class="filter-option active" data-filter="cat" data-val="all">Tất cả <span class="count">8</span></button>
                    <button class="filter-option" data-filter="cat" data-val="daicuong">Đại cương <span class="count">3</span></button>
                    <button class="filter-option" data-filter="cat" data-val="chuyennganh">Chuyên ngành <span class="count">5</span></button>
                </div>

                <div class="filter-group">
                    <div class="filter-group-title">Cấp độ</div>
                    <button class="filter-option active" data-filter="level" data-val="all">Tất cả</button>
                    <button class="filter-option" data-filter="level" data-val="Cơ bản">Cơ bản</button>
                    <button class="filter-option" data-filter="level" data-val="Trung cấp">Trung cấp</button>
                    <button class="filter-option" data-filter="level" data-val="Nâng cao">Nâng cao</button>
                </div>

                <button class="btn-reset-filter" id="resetFilter">Xóa bộ lọc</button>
            </aside>

            <!-- Main -->
            <div class="courses-main">
                <div class="courses-topbar">
                    <div class="search-bar">
                        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-3);flex-shrink:0;"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                        <input type="text" id="courseSearch" placeholder="Tìm kiếm khóa học...">
                    </div>
                    <div style="display:flex;align-items:center;gap:12px;">
                        <span class="courses-count" id="coursesCount"><strong>8</strong> khóa học</span>
                        <select class="sort-select" id="sortSelect">
                            <option value="popular">Phổ biến nhất</option>
                            <option value="rating">Đánh giá cao</option>
                            <option value="az">A - Z</option>
                        </select>
                    </div>
                </div>
                <div id="courseOutput"></div>
            </div>
        </div>
    </div>

    <script src="components/footer.js"></script>
    <script src="js/index.js"></script>
    <script src="js/courses.js"></script>
</body>
</html>
