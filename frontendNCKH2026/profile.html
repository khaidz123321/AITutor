<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ sơ cá nhân - PTIT E-Learning</title>
    <link rel="stylesheet" href="css/global.css">
    <style>
        .profile-hero {
            background: linear-gradient(135deg,#1a0203,#9b181d);
            padding: 60px 0 80px; color: #fff; position: relative; overflow: hidden;
        }
        .profile-hero::after {
            content:'PTIT'; position:absolute; right:-20px; bottom:-30px;
            font-size:180px; font-weight:900; color:rgba(255,255,255,.04); line-height:1;
        }
        .profile-avatar-big {
            width: 88px; height: 88px; border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff; font-size: 28px; font-weight: 900;
            display: flex; align-items: center; justify-content: center;
            border: 3px solid rgba(255,255,255,.25);
            margin-bottom: 16px;
        }
        .profile-name  { font-size: 26px; font-weight: 900; margin-bottom: 4px; }
        .profile-email { font-size: 14px; opacity: .7; margin-bottom: 14px; }

        .profile-layout {
            display: grid; grid-template-columns: 260px 1fr; gap: 32px;
            padding: 40px 0 80px; align-items: start;
            margin-top: -40px;
        }
        .profile-sidebar {
            background: var(--bg-white); border: 1px solid var(--border);
            border-radius: var(--radius-lg); overflow: hidden;
        }
        .profile-nav a {
            display: flex; align-items: center;
            padding: 14px 20px; font-size: 14px; font-weight: 500;
            color: var(--text-2); border-bottom: 1px solid var(--border-light);
            transition: all var(--transition); text-decoration: none;
        }
        .profile-nav a:hover, .profile-nav a.active {
            background: var(--primary-light); color: var(--primary);
        }
        .profile-nav a:last-child { border-bottom: none; }

        .profile-card {
            background: var(--bg-white); border: 1px solid var(--border);
            border-radius: var(--radius-lg); padding: 32px; margin-bottom: 24px;
        }
        .profile-card-title {
            font-size: 17px; font-weight: 700; margin-bottom: 24px;
            padding-bottom: 16px; border-bottom: 1px solid var(--border);
            color: var(--text-1);
        }
        .stats-row {
            display: grid; grid-template-columns: repeat(4,1fr);
            gap: 16px; margin-bottom: 32px;
        }
        .stat-box {
            background: var(--bg); border: 1px solid var(--border);
            border-radius: var(--radius-lg); padding: 20px; text-align: center;
        }
        .stat-box .n { font-size: 24px; font-weight: 900; color: var(--primary); line-height:1.1; }
        .stat-box .l { font-size: 12px; color: var(--text-3); margin-top: 4px; font-weight:500; }

        @media(max-width:900px) {
            .profile-layout { grid-template-columns: 1fr; }
            .stats-row { grid-template-columns: repeat(2,1fr); }
        }
    </style>
</head>
<body>
    <script src="components/header.js"></script>

    <div class="profile-hero">
        <div class="container" style="position:relative;z-index:2;">
            <div class="profile-avatar-big" id="profileAvatar">PT</div>
            <div class="profile-name" id="profileName">Người dùng</div>
            <div class="profile-email" id="profileEmail">email@ptit.edu.vn</div>
            <span class="badge" style="background:rgba(255,255,255,.15);color:#fff;font-size:12px;">Sinh viên PTIT</span>
        </div>
    </div>

    <div class="container">
        <div class="profile-layout">
            <!-- Sidebar -->
            <div class="profile-sidebar">
                <div class="profile-nav">
                    <a href="#" class="active">Thông tin cá nhân</a>
                    <a href="my-courses.html">Khóa học của tôi</a>
                    <a href="#">Thống kê học tập</a>
                    <a href="#">Bảo mật tài khoản</a>
                    <a href="#" id="profileLogout" style="color:var(--primary);">Đăng xuất</a>
                </div>
            </div>

            <!-- Main -->
            <div>
                <div class="stats-row">
                    <div class="stat-box"><div class="n">3</div><div class="l">Khóa đang học</div></div>
                    <div class="stat-box"><div class="n">14h</div><div class="l">Tổng thời gian</div></div>
                    <div class="stat-box"><div class="n">32</div><div class="l">Câu hỏi AI</div></div>
                    <div class="stat-box"><div class="n">0</div><div class="l">Chứng chỉ</div></div>
                </div>

                <div class="profile-card">
                    <div class="profile-card-title">Thông tin cá nhân</div>
                    <form id="profileForm">
                        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
                            <div class="form-group">
                                <label for="pfName">Họ và tên</label>
                                <input type="text" id="pfName" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label for="pfEmail">Email</label>
                                <input type="email" id="pfEmail" class="form-control" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="pfBio">Giới thiệu bản thân</label>
                            <textarea id="pfBio" class="form-control" rows="3" placeholder="Sinh viên K2x — Khoa Công nghệ thông tin — PTIT Hà Nội"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Lưu thay đổi</button>
                    </form>
                </div>

                <div class="profile-card">
                    <div class="profile-card-title">Đổi mật khẩu</div>
                    <div class="form-group">
                        <label>Mật khẩu hiện tại</label>
                        <input type="password" class="form-control" placeholder="Nhập mật khẩu hiện tại">
                    </div>
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
                        <div class="form-group">
                            <label>Mật khẩu mới</label>
                            <input type="password" class="form-control" placeholder="Tối thiểu 8 ký tự">
                        </div>
                        <div class="form-group">
                            <label>Xác nhận mật khẩu</label>
                            <input type="password" class="form-control" placeholder="Nhập lại mật khẩu mới">
                        </div>
                    </div>
                    <button class="btn btn-secondary">Cập nhật mật khẩu</button>
                </div>
            </div>
        </div>
    </div>

    <script src="components/footer.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const stored = localStorage.getItem('ptit_user');
        if (!stored) { window.location.href = 'login.html'; return; }
        const user = JSON.parse(stored);
        const initials = user.name.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();

        document.getElementById('profileAvatar').textContent = initials;
        document.getElementById('profileName').textContent   = user.name;
        document.getElementById('profileEmail').textContent  = user.email;
        document.getElementById('pfName').value  = user.name;
        document.getElementById('pfEmail').value = user.email;

        document.getElementById('profileForm').addEventListener('submit', (e) => {
            e.preventDefault();
            user.name  = document.getElementById('pfName').value;
            user.email = document.getElementById('pfEmail').value;
            localStorage.setItem('ptit_user', JSON.stringify(user));
            showToast && showToast('Đã lưu thông tin!');
        });

        document.getElementById('profileLogout').addEventListener('click', (e) => {
            e.preventDefault();
            localStorage.removeItem('ptit_user');
            window.location.href = 'index.html';
        });
    });
    </script>
</body>
</html>
