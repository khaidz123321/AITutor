events {
    worker_connections 1024;
}

http {
    client_max_body_size 100M;
    
    server {
        listen 80;
        server_name api.ptitaitutor.com ptitaitutor.com www.ptitaitutor.com;

        location / {
            proxy_pass http://spring-api:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Tăng timeout tránh 504 Gateway Timeout khi xử lý AI
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            send_timeout 300s;
        }
    }

    server {
        listen 80;
        server_name ai.ptitaitutor.com;

        location / {
            proxy_pass http://ai-api:8001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Tăng timeout cho AI Service (DeepSeek-R1 / Qwen Multi-Agent)
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            send_timeout 300s;
        }
    }
}
