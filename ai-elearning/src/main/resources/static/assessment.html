<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Khảo thí & Đánh giá — PTIT E-Learning">
    <title>Khảo Thí & Đánh Giá — PTIT E-Learning</title>
    <link rel="stylesheet" href="css/global.css">
    <style>
        .dev-main {
            padding: 80px 0 100px;
            background: var(--bg);
            min-height: calc(100vh - 200px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dev-card {
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 56px 48px;
            max-width: 680px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(122, 19, 24, 0.08);
            position: relative;
            overflow: hidden;
            margin: 0 auto;
        }

        .dev-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, #7a1318, #dc2626, #fbbf24);
        }

        .dev-icon-wrap {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: #fdf4f4;
            color: #7a1318;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 28px;
            border: 2px solid rgba(122, 19, 24, 0.15);
            box-shadow: 0 10px 24px rgba(122, 19, 24, 0.12);
        }

        .dev-badge {
            display: inline-block;
            background: #fef3c7;
            color: #d97706;
            font-weight: 800;
            font-size: 12px;
            padding: 6px 16px;
            border-radius: 20px;
            letter-spacing: .8px;
            text-transform: uppercase;
            margin-bottom: 16px;
        }

        .dev-title {
            font-size: 32px;
            font-weight: 900;
            color: var(--text-1);
            margin-bottom: 14px;
            letter-spacing: -.5px;
        }

        .dev-desc {
            font-size: 15.5px;
            color: var(--text-3);
            line-height: 1.7;
            margin-bottom: 36px;
            max-width: 520px;
            margin-left: auto;
            margin-right: auto;
        }

        .dev-actions {
            display: flex;
            gap: 16px;
            justify-content: center;
        }

        @media (max-width: 640px) {
            .dev-card { padding: 40px 24px; }
            .dev-title { font-size: 26px; }
            .dev-actions { flex-direction: column; }
        }
    </style>
    <script src="js/i18n.js"></script>
</head>

<body>
    <script src="components/header.js"></script>

    <main class="dev-main">
        <div class="container">
            <div class="dev-card">
                <div class="dev-icon-wrap">
                    <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
                    </svg>
                </div>
                <div class="dev-badge">THÔNG BÁO HỆ THỐNG</div>
                <h1 class="dev-title">Tính năng đang được phát triển</h1>
                <p class="dev-desc">
                    Hệ thống Khảo thí & Đánh giá trình độ trực tuyến tích hợp AI đang được Học viện Công nghệ Bưu chính Viễn thông nghiên cứu và nâng cấp. Tính năng sẽ sớm hoàn thiện và ra mắt trong phiên bản tiếp theo.
                </p>
                <div class="dev-actions">
                    <a href="index.html" class="btn btn-primary" style="padding:12px 28px; border-radius:12px; font-weight:800;">
                        ➔ Quay lại Trang chủ
                    </a>
                    <a href="courses.html" class="btn btn-secondary" style="padding:12px 24px; border-radius:12px; font-weight:700;">
                        Xem khóa học
                    </a>
                </div>
            </div>
        </div>
    </main>

    <script src="components/footer.js"></script>
</body>

</html>
