<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khóa học của tôi - PTIT E-Learning</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/my-courses.css">
    <script src="js/i18n.js"></script>
</head>

<body>
    <script src="components/header.js"></script>

    <div class="container">
        <div class="my-courses-layout">
            <!-- Filter Container -->
            <div class="filter-container">
                <div class="category-filter-wrap">
                    <label for="categoryFilter">Phân loại:</label>
                    <select id="categoryFilter" class="category-select">
                        <option value="">Tất cả môn học</option>
                        <option value="daicuong">Đại Cương</option>
                        <option value="chuyennganh">Chuyên ngành</option>
                    </select>
                </div>
                <div class="search-filter-wrap">
                    <input type="text" id="courseSearch" class="search-input" placeholder="Tìm kiếm khóa học của tôi...">
                    <svg class="search-icon-svg" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </div>
            </div>

            <!-- Section: Active Courses -->
            <div class="section-header-row">
                <h2 class="section-title-red">Khóa học đang học</h2>
                <span class="section-stats-text" id="activeStatsText">0 Khóa học | 0 Bài học</span>
            </div>
            <div class="course-grid" id="activeCoursesGrid"></div>

            <!-- Section: Completed Courses -->
            <div class="section-header-row" style="margin-top: 48px;">
                <h2 class="section-title-red">Khóa học đã hoàn thành</h2>
                <span class="section-stats-text" id="completedStatsText">0 Khóa học | 0 Bài học</span>
            </div>
            <div class="course-grid" id="completedCoursesGrid"></div>
        </div>
    </div>

    <script src="components/footer.js"></script>
    <script src="js/index.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('ptit_token');
            if (!token) { window.location.href = 'login.html'; return; }

            let allEnrollments = [];
            let coursesMap = {};

            fetch('/api/v1/courses/enrolled', { headers: { 'Authorization': 'Bearer ' + token } })
                .then(res => res.json())
                .then(coursesRes => {
                    if (coursesRes.success) {
                        const coursesList = coursesRes.data || [];
                        const profilePromises = coursesList.map(c => 
                            fetch(`/api/v1/learning-profiles/me?courseId=${c.id}`, { headers: { 'Authorization': 'Bearer ' + token } })
                                .then(res => res.json())
                                .then(profRes => {
                                    if (profRes.success) {
                                        return {
                                            courseId: c.id,
                                            courseTitle: c.title,
                                            progressPercent: profRes.data.progressPercent || 0,
                                            category: c.level === 'BEGINNER' || c.level === 'INTERMEDIATE' ? 'daicuong' : 'chuyennganh',
                                            course: c
                                        };
                                    }
                                    return null;
                                })
                                .catch(() => null)
                        );

                        Promise.all(profilePromises).then(results => {
                            allEnrollments = results.filter(r => r !== null);
                            allEnrollments.forEach(e => {
                                coursesMap[e.courseId] = e.course;
                            });

                            document.getElementById('categoryFilter')?.addEventListener('change', filterAndRender);
                            document.getElementById('courseSearch')?.addEventListener('input', filterAndRender);

                            filterAndRender();
                        });
                    }
                })
                .catch(err => {
                    console.error(err);
                    filterAndRender();
                });

            function filterAndRender() {
                const catVal = document.getElementById('categoryFilter')?.value || '';
                const searchVal = document.getElementById('courseSearch')?.value?.toLowerCase()?.trim() || '';

                const filtered = allEnrollments.filter(e => {
                    const matchesCat = !catVal || e.category === catVal;
                    const matchesSearch = !searchVal || e.courseTitle.toLowerCase().includes(searchVal);
                    return matchesCat && matchesSearch;
                });

                const active = filtered.filter(e => e.progressPercent < 100);
                const completed = filtered.filter(e => e.progressPercent === 100);

                const activeLessons = active.reduce((sum, e) => sum + (coursesMap[e.courseId]?.chapterCount || 12), 0);
                document.getElementById('activeStatsText').textContent = `${active.length} Khóa học | ${activeLessons} Chương`;

                const completedLessons = completed.reduce((sum, e) => sum + (coursesMap[e.courseId]?.chapterCount || 12), 0);
                document.getElementById('completedStatsText').textContent = `${completed.length} Khóa học | ${completedLessons} Chương`;

                renderSection('activeCoursesGrid', active);
                renderSection('completedCoursesGrid', completed);
            }

            function renderSection(gridId, list) {
                const grid = document.getElementById(gridId);
                if (!grid) return;

                if (list.length === 0) {
                    grid.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon-circle">
                        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#7a1318" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
                            <circle cx="12" cy="10" r="2.5"/>
                            <path d="m14 12 2.5 2.5"/>
                        </svg>
                    </div>
                    <div class="empty-text">Chưa có khóa học nào</div>
                    <div class="empty-subtext">Danh sách khóa học ở mục này hiện đang trống.</div>
                </div>`;
                    grid.style.display = 'block';
                    return;
                }

                grid.style.display = 'grid';

                grid.innerHTML = list.map((e, i) => {
                    const course = coursesMap[e.courseId] || { title: e.courseTitle, id: e.courseId };
                    return renderCourseCard(course, true);
                }).join('');
            }
        });
    </script>
</body>

</html>
