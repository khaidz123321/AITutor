# Application
spring.application.name=ai-elearning

# Server
server.port=8080

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/ai_elearning_db
spring.datasource.username=postgres
spring.datasource.password=Ktobii@055
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-ms=1800000
jwt.refresh-expiration-ms=604800000

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.timeout=60000ms

# Mail (mock - log to console in dev)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=noreply@ai-elearning.com
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Actuator Health Indicators
management.health.mail.enabled=false
management.health.redis.enabled=false

# AI Service
ai.service.url=http://127.0.0.1:8001
ai.service.api-key=internal-service-key

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}

# Logging
logging.level.re.edu.ai_elearning=DEBUG
logging.level.org.springframework.security=INFO

# File Upload Limit
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB