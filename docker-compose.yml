services:
  postgres:
    image: postgres:15
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ai_elearning_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ai_elearning_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis_cache
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  ai-api:
    image: vuquockhai/aitutor-ai-api:latest
    container_name: ai_api
    ports:
      - "127.0.0.1:8001:8001"
    env_file:
      - ./AI/.env
    environment:
      # Ghi đè biến POSTGRES_SERVER trỏ về container postgres (thay vì localhost)
      - POSTGRES_SERVER=postgres
    volumes:
      # Mount model 2GB từ máy host vào container (không nhét vào image)
      - ./AI/multilingual-e5-large-finetuned:/app/multilingual-e5-large-finetuned:ro
      # Mount uploads folder để lưu file người dùng upload
      - ./AI/uploads:/app/uploads
      # Mount vector DB để persist dữ liệu RAG
      - ./AI/data/vector_db:/app/data/vector_db
      # Mount rag_input để dữ liệu giáo trình đồng bộ trực tiếp từ server
      - ./AI/data/rag_input:/app/data/rag_input
      # Mount prompts để question bank và persona đồng bộ trực tiếp từ server
      - ./AI/prompts:/app/prompts
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  spring-api:
    image: vuquockhai/aitutor-spring-api:latest
    container_name: spring_api
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # Ghi đè các cấu hình kết nối ứng dụng Spring Boot trỏ tới các services trong Docker network
      - spring.datasource.url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ai_elearning_db}
      - spring.datasource.username=${POSTGRES_USER:-postgres}
      - spring.datasource.password=${POSTGRES_PASSWORD}
      - spring.data.redis.host=redis
      - spring.data.redis.port=6379
      - ai.service.url=http://ai-api:8001
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
    volumes:
      # Mount uploads folder để lưu trữ avatar và khóa học
      - ./ai-elearning/uploads:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-api:
        condition: service_started
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - spring-api
      - ai-api
    restart: unless-stopped

volumes:
  postgres_data:
